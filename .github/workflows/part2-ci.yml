
name: RaceDay Part 2 Build and Test

on:
  push:
    branches:
      - main
      - part2-api-development
  pull_request:
    branches:
      - main
      - part2-api-development

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test RaceDay
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore RaceDay.Api.Tests/RaceDay.Api.Tests.csproj

      - name: Build API and tests
        run: dotnet build RaceDay.Api.Tests/RaceDay.Api.Tests.csproj --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test RaceDay.Api.Tests/RaceDay.Api.Tests.csproj --configuration Release --no-build --verbosity normal
